<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Altea Partner Quotes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font-family:system-ui,sans-serif;margin:0;color:#1a1a1a;background:#fafafa}
 main{max-width:900px;margin:0 auto;padding:16px}
 .bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;margin-bottom:12px}
 textarea{width:100%;padding:8px;box-sizing:border-box}
 table{border-collapse:collapse;width:100%;margin:12px 0;background:#fff}
 th,td{border:1px solid #ddd;padding:6px 10px;text-align:left;font-size:14px}
 .n{text-align:right}
 .badge{font-size:12px;border-radius:99px;padding:2px 10px;background:#e8efe9;margin-left:8px}
 .pending{background:#fff1d6}
 .why{font-size:13px;color:#555}
 button{padding:8px 12px;cursor:pointer}
 pre{white-space:pre-wrap;background:#fff;border:1px solid #ddd;padding:10px;border-radius:8px}
</style></head>
<body><main>
 <h2>Altea Partner Quotes</h2>
 <div class="bar">
  <label>Account <select id="acct"></select></label>
  <label>Signed in as <select id="role">
   <option value="partner">Partner buyer</option>
   <option value="manager">Sales manager</option>
   <option value="director">Sales director</option>
   <option value="visitor">Visitor (no access)</option></select></label>
 </div>
 <textarea id="msg" rows="4">We need 12 Hub Pro units for a residential complex, installation included. Can you do 18% off?</textarea>
 <p><button id="go">Generate quote</button> <span class="why" id="err"></span></p>
 <div id="out"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const call = async (url, body) => {
  const r = await fetch(url, body ? {method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined);
  return {ok: r.ok, data: await r.json()};
};
const el = (tag, text, cls) => {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
};
const eur = v => v.toFixed(2) + " EUR";
const row = (cells, tag = "td") => {
  const tr = el(tag === "th" ? "tr" : "tr");
  cells.forEach(([text, num]) => tr.append(el(tag, text, num ? "n" : "")));
  return tr;
};

function render(q) {
  const out = $("out"); out.replaceChildren();
  const h = el("h3", `Quote ${q.id} · ${q.account} (${q.tier})`);
  h.append(el("span", q.status, "badge" + (q.status.startsWith("pending") ? " pending" : "")));
  out.append(h);
  const t = el("table");
  t.append(row([["Item"], ["Qty", 1], ["Unit", 1], ["Total", 1]], "th"));
  q.lines.forEach(l => t.append(row([[l.name], [l.quantity, 1], [eur(l.unit_eur), 1], [eur(l.line_eur), 1]])));
  t.append(row([["Subtotal"], [""], [""], [eur(q.subtotal_eur), 1]]));
  t.append(row([["Discount " + q.discount_pct + "%"], [""], [""], ["-" + eur(q.discount_eur), 1]]));
  t.append(row([["Total (VAT excluded)"], [""], [""], [eur(q.total_eur), 1]]));
  out.append(t);
  out.append(el("p", `Valid until ${q.valid_until}. Standard discount: ${q.standard_discount_pct}%.`, "why"));
  if (q.status.startsWith("pending")) {
    out.append(el("p", `You requested ${q.requested_discount_pct}%. If approved, the total would be ${eur(q.total_if_approved_eur)}.`));
    const b = el("button", "Approve as the selected role");
    b.onclick = async () => {
      const r = await call(`/api/quote/${q.id}/approve`, {role: $("role").value});
      if (r.ok) render(r.data); else alert(r.data.detail);
    };
    out.append(b);
  }
  q.clarifications.forEach(c => out.append(el("p", "Note: " + c, "why")));
  q.suggestions.forEach(s => out.append(el("p", `Suggested add-on: ${s.name}. ${s.why}.`, "why")));
  out.append(el("h4", "Terms (from policy documents)"), el("pre", q.terms),
             el("div", "Sources: " + q.terms_sources.join(", "), "why"));
}

$("go").onclick = async () => {
  $("err").textContent = "Working...";
  const r = await call("/api/quote", {account_id: $("acct").value,
                                message: $("msg").value, role: $("role").value});
  $("err").textContent = r.ok ? "" : r.data.detail;
  if (r.ok) render(r.data);
};
(async () => {
  const r = await call("/api/accounts");
  r.data.forEach(a => $("acct").add(new Option(`${a.name} (${a.tier})`, a.id)));
})();
</script></body></html>
